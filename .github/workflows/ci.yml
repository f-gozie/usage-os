name: CI

on:
  push:
    # spike/** runs the Windows spike job below; remove with that job.
    branches: [main, 'spike/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS is the only shipping target (CLAUDE.md: "No Windows/Linux in
        # v1"). Linux stays as cheap headless CI: it hosts the binding-freshness
        # gate and exercises the platform-agnostic core (repository, migrations,
        # category engine). Windows was dropped — the tauri-specta/specta stack
        # fails to link there (STATUS_ENTRYPOINT_NOT_FOUND) and we will never
        # ship it, so gating on it is wasted effort.
        include:
          - os: ubuntu-latest
            rust: stable
          - os: macos-latest
            rust: stable

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # tauri-build validates that every `externalBin` path EXISTS at compile time (on all
      # platforms), so cargo build/test/clippy need the sidecar binary present. The real
      # FoundationModels sidecar is macOS-26-only Swift (built by sidecar/build.sh + the
      # non-blocking Swift lane below), and the app is never RUN in CI — tests use the
      # FakeNarrator (C19). So a stub satisfies the bundler; nothing executes it.
      - name: Stage placeholder sidecar binary
        shell: bash
        run: |
          TRIPLE="$(rustc --print host-tuple 2>/dev/null || rustc -vV | sed -n 's/^host: //p')"
          mkdir -p src-tauri/binaries
          printf '#!/bin/sh\n' > "src-tauri/binaries/usageos-ai-$TRIPLE"
          chmod +x "src-tauri/binaries/usageos-ai-$TRIPLE"
          echo "staged src-tauri/binaries/usageos-ai-$TRIPLE"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxss-dev \
            libxdo-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Run TypeScript tests
        run: npx vitest run

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Run Clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      # Binding-freshness gate (hard rules 2 + 8): the generated src/bindings.ts
      # must match what the export test produces. Linux-only — pure codegen, no
      # macOS APIs, and a single OS avoids line-ending false positives.
      - name: Regenerate IPC bindings
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo test export_bindings

      - name: Assert IPC bindings are fresh
        if: runner.os == 'Linux'
        run: git diff --exit-code -- src/bindings.ts

      - name: Build Rust (validate compilation)
        working-directory: src-tauri
        run: cargo build

  # The real Foundation Models sidecar (Swift) only compiles against the macOS 26 SDK with
  # Apple Intelligence — unavailable on standard GitHub runners. This lane attempts the build
  # so it starts passing the moment hosted runners reach macOS 26; until then it skips
  # gracefully (green) and never gates the cross-platform `test` matrix (C19/C20).
  sidecar-swift:
    name: Sidecar (Swift, macOS 26 — non-blocking)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Build usageos-ai sidecar (skips if SDK < macOS 26)
        shell: bash
        run: |
          SDK_VER="$(xcrun --sdk macosx --show-sdk-version 2>/dev/null || echo 0)"
          MAJOR="${SDK_VER%%.*}"
          echo "macOS SDK version: $SDK_VER"
          if [ "${MAJOR:-0}" -ge 26 ]; then
            echo "Building the FoundationModels sidecar against the macOS $SDK_VER SDK."
            ( cd sidecar/usageos-ai && swift build -c release )
          else
            echo "SDK < 26 — FoundationModels is unavailable on this runner; skipping the build."
            echo "(The sidecar is verified on-device + by sidecar/build.sh; see the spike README.)"
          fi

  # SPIKE (spike/windows-port only, not for main): does UsageOS build, test and bundle on
  # Windows? Every step is continue-on-error so one run records the whole picture. Findings:
  # context/plans/2026-10-20-windows-spike/.
  windows-spike:
    name: Windows spike (non-blocking)
    if: startsWith(github.ref, 'refs/heads/spike/')
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings (bindings diff)
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Same stub as the test job; tauri-build wants the .exe suffix on Windows.
      - name: Stage placeholder sidecar binary
        run: |
          TRIPLE="$(rustc --print host-tuple 2>/dev/null || rustc -vV | sed -n 's/^host: //p')"
          mkdir -p src-tauri/binaries
          printf 'stub' > "src-tauri/binaries/usageos-ai-$TRIPLE.exe"
          echo "staged src-tauri/binaries/usageos-ai-$TRIPLE.exe"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Check TypeScript types
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Run TypeScript tests
        continue-on-error: true
        run: npx vitest run

      - name: Build Rust
        id: build
        continue-on-error: true
        working-directory: src-tauri
        run: cargo build

      - name: Run Clippy (deny warnings)
        id: clippy
        continue-on-error: true
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        id: test
        continue-on-error: true
        working-directory: src-tauri
        run: cargo test 2>&1 | tee ../cargo-test.log; exit ${PIPESTATUS[0]}

      # Which executables import TaskDialogIndirect (comctl32 v6 only) and which carry the
      # common-controls manifest. Counts are byte matches; 0 means absent.
      - name: Inspect executables (TaskDialogIndirect, manifest)
        continue-on-error: true
        working-directory: src-tauri/target/debug
        run: |
          for f in usage-os.exe deps/usage_os_lib-*.exe; do
            imp=$(grep -c -a TaskDialogIndirect "$f" || true)
            man=$(grep -c -a Microsoft.Windows.Common-Controls "$f" || true)
            echo "$f TaskDialogIndirect=$imp manifest=$man" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Regenerate IPC bindings
        id: bindings
        continue-on-error: true
        working-directory: src-tauri
        run: cargo test export_bindings

      - name: Assert IPC bindings are fresh
        id: bindings_fresh
        continue-on-error: true
        run: git diff --exit-code -- src/bindings.ts

      # Release bundle without signing or updater artifacts (no keys on this branch).
      - name: Bundle NSIS installer (unsigned)
        id: bundle
        continue-on-error: true
        run: npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload installer
        if: steps.bundle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: usageos-windows-spike-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo "| step | outcome |"
            echo "|---|---|"
            echo "| cargo build | ${{ steps.build.outcome }} |"
            echo "| clippy -D warnings | ${{ steps.clippy.outcome }} |"
            echo "| cargo test | ${{ steps.test.outcome }} |"
            echo "| export_bindings | ${{ steps.bindings.outcome }} |"
            echo "| bindings fresh | ${{ steps.bindings_fresh.outcome }} |"
            echo "| NSIS bundle | ${{ steps.bundle.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
